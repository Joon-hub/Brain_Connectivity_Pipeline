# ===============================================================================
# HEMISPHERE-SPECIFIC BRAIN REGION CLASSIFICATION CONFIGURATION
# ===============================================================================
# Updated to match new preprocessing flow:
#   1. Diagonal imputation + Fisher Z BEFORE cross-validation
#   2. StandardScaler on full dataset for Optuna
#   3. StandardScaler within CV folds (leak-free)
# ===============================================================================

# --- GLOBAL SETTINGS ---
data:
  input_dir: "data/processed/hemispheres"
  output_dir: "data/results/hemisphere_analysis"
  region_info: "data/processed/region_info.csv"
  dataset: "rest"                                  # 'rest' (PIOP2) or 'task' (PIOP1)
  hemisphere_split: "atlas_based"
  return_matrices: true
  include_bilateral: false

reproducibility:
  random_state: 42
  numpy_seed: 42
  python_seed: 42
  use_deterministic: true
  save_env_info: true

logging:
  level: "INFO"
  log_to_file: true
  log_to_console: true

computation:
  n_jobs: -1
  memory_efficient: true
  use_gpu: false


# --- PREPROCESSING ---
# NOTE: Preprocessing now happens in stages:
#   1. Diagonal imputation + Fisher Z → Applied ONCE before CV
#   2. StandardScaler → Applied on full data for Optuna, then within each CV fold
preprocessing:
  # Stage 1: Applied ONCE to full dataset before CV
  diagonal_imputation:
    enabled: true
    strategy: "region_mean"           # Options: 'zero', 'region_mean', 'network_mean', 'global_mean'
    
  fisher_z_transformation:
    enabled: true
    clip_values: true
    clip_range: [-0.999, 0.999]       # Prevent arctanh overflow
  
  # Stage 2: StandardScaler behavior
  standardization:
    enabled: true
    for_optuna: true                  # Scale full dataset for Optuna
    per_fold: true                    # Re-scale within each CV fold (leak-free)
  
  # Feature selection (currently not implemented)
  feature_selection:
    enabled: false
    method: null                      # Options: null, 'variance_threshold', 'mutual_info'
    variance_threshold: 0.01


# --- CROSS-VALIDATION ---
cross_validation:
  strategy: "GroupKFold"              # Prevents subject leakage
  n_folds: 5                          # Number of CV folds (use 3 for testing)
  random_state: 42


# --- MODEL CONFIGURATION ---
model:
  type: "LogisticRegression"
  multi_class: "multinomial"          # 116-class softmax classifier
  penalty: "l2"                       # L2 regularization
  tol: 0.0001                         # Convergence tolerance
  class_weight: null                  # Options: null, 'balanced'
  warm_start: false
  
  # Default hyperparameters (used if tuning disabled)
  default_params:
    C: 1.0                            # Inverse regularization strength
    solver: "lbfgs"                   # Options: 'lbfgs', 'sag', 'saga', 'newton-cg'
    max_iter: 1000                    # Maximum optimization iterations
    n_jobs: -1                        # Use all CPU cores
    verbose: 0                        # Suppress iteration logs


# --- HYPERPARAMETER OPTIMIZATION ---
hyperparameter_optimization:
  enabled: true                       # Enable hyperparameter tuning
  method: "optuna"                    # Only 'optuna' supported in new version
  
  optuna:
    n_trials: 50                      # Number of optimization trials
    sampler: "TPE"                    # Tree-structured Parzen Estimator
    
    # Search space for hyperparameters
    search_space:
      C:
        type: "float"
        range: [0.001, 10.0]
        log: true                     # Log scale for better exploration
      
      max_iter:
        type: "categorical"
        choices: [200, 500, 1000]
      
      solver:
        type: "categorical"
        choices: ["lbfgs", "saga"]
    
    # Optuna settings
    direction: "maximize"             # Maximize accuracy
    show_progress_bar: false          # Cleaner logs
    timeout: null                     # No time limit
    
    # Evaluation method
    evaluation:
      method: "simple_split"          # Simple train/test split (no inner CV)
      test_size: 0.2                  # 80/20 split
      stratify: true                  # Maintain class balance
      random_state: 42
    
    # Logging
    verbose: true
    log_trials: true
    save_study: false                 # Don't save Optuna study object


# --- EVALUATION METRICS ---
evaluation:
  metrics:
    - "accuracy"
    - "balanced_accuracy"
    - "top_5_accuracy"
    - "top_10_accuracy"
  
  compute_per_region: true            # Region-level accuracy
  compute_network_level: true         # Network-level accuracy
  
  confusion_matrix:
    compute: true
    normalize: false                  # Options: false, 'true', 'pred', 'all'
  
  save_outputs:
    predictions: true                 # Save CV predictions
    probabilities: true               # Save class probabilities
    models: false                     # Don't save models (large files)
    fold_indices: true                # Save which samples in which fold


# --- OUTPUT STRUCTURE ---
output:
  create_subdirectories: true
  subdirectory_structure:
    - "multinomial"
    - "ovr"
    - "ovo"
    - "comparison"
  
  use_timestamps: false
  timestamp_format: "%Y%m%d_%H%M%S"
  
  file_formats:
    metrics: "json"
    predictions: "npy"
    probabilities: "npy"
    per_region_metrics: "csv"
    network_metrics: "csv"
  
  compression:
    enabled: false
    format: "gzip"                    # Options: 'gzip', 'bz2', 'xz'


# --- VISUALIZATION ---
visualization:
  confusion_matrix:
    enabled: true
    format: "png"
    dpi: 300
    show_network_boundaries: true
  
  per_region_accuracy:
    enabled: true
    format: "png"
    dpi: 300
    sort_by: "network"                # Options: 'network', 'accuracy', 'region_id'
  
  network_accuracy:
    enabled: true
    format: "png"
    dpi: 300


# --- HEMISPHERE COMPARISON ---
hemisphere_comparison:
  enabled: true
  
  statistical_tests:
    - "paired_ttest"                  # Compare fold accuracies
    - "pearsonr"                      # Correlate per-region accuracies
  
  alpha: 0.05                         # Significance threshold
  
  visualizations:
    - "accuracy_comparison"           # Bar plot
    - "per_region_scatter"            # Scatter plot of accuracies


# --- VALIDATION CHECKS ---
validation:
  # Data integrity
  check_data_integrity: true          # Verify file existence, shapes
  check_nan: true                     # Detect missing values
  check_inf: true                     # Detect infinite values
  
  # Cross-validation integrity
  check_leakage: true                 # Verify train/test subject separation
  validate_cv_splits: true            # Confirm GroupKFold behavior
  
  # Class balance
  check_class_balance: true
  warn_imbalance_threshold: 0.1       # Warn if any class < 10% of data


# --- ADVANCED SETTINGS ---
advanced:
  # Memory management
  memory_efficient_mode: true
  batch_processing: false
  
  # Debugging
  save_intermediate_results: true
  cleanup_temp_files: true
  
  # Performance monitoring
  profile_performance: false
  track_memory_usage: false


# ===============================================================================
# NOTES FOR USERS
# ===============================================================================
# 
# PREPROCESSING FLOW:
#   1. Load connectivity matrices
#   2. Apply diagonal imputation (ONCE, before CV)
#   3. Apply Fisher Z transformation (ONCE, before CV)
#   4. Flatten to features
#   5. [If tuning] Scale full dataset → Run Optuna → Get best hyperparameters
#   6. Cross-validation: Scale within each fold (leak-free) → Train → Evaluate
#
# HYPERPARAMETER TUNING:
#   - Optuna runs on the FULL SCALED dataset
#   - Uses simple 80/20 split (no inner CV for speed)
#   - Selected hyperparameters used in all CV folds
#   - Final evaluation still uses proper fold-wise scaling
#
# TYPICAL USAGE:
#   
#   Testing mode (7 subjects, 3 trials, 3 folds):
#   python scripts/hemisphere/02_train_hemisphere_multinomial.py \
#       --hemisphere left \
#       --sample 7 \
#       --tune_hyperparams \
#       --optuna_trials 3 \
#       --n_folds 3
#   
#   Production mode (all subjects, 50 trials, 5 folds):
#   python scripts/hemisphere/02_train_hemisphere_multinomial.py \
#       --hemisphere left \
#       --tune_hyperparams \
#       --optuna_trials 50 \
#       --n_folds 5
#
# ===============================================================================