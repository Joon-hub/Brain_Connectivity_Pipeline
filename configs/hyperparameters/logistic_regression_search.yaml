# Hyperparameter Search Space for Logistic Regression (Nested CV)
# This format ensures the Python script knows the TYPE of distribution (e.g., "choice")
# and can find the required parameters (e.g., "values").

param_distributions:
  # Regularization strength (inverse)
  classifier__C:
    type: "choice"
    values: [0.03, 0.1, 0.3]
  
  # Maximum number of iterations for convergence
  classifier__max_iter:
    type: "choice"
    values: [100, 300, 500]
  
  # Optimization algorithm
  classifier__solver:
    type: "choice"
    values: ["lbfgs", "saga"]

# Nested Cross-Validation Settings
n_iter: 10             
outer_cv: 3            
inner_cv: 3           
random_seed: 42