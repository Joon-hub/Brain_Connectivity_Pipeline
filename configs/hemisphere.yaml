# =============================================================================
# HEMISPHERE-SPECIFIC BRAIN REGION CLASSIFICATION CONFIGURATION
# =============================================================================
# Purpose: Configure multinomial logistic regression for left/right hemisphere
#          brain region classification using resting-state connectivity data
# Dataset: PIOP-2 resting-state, 224 subjects, 116 regions per hemisphere
# Usage:   python scripts/hemisphere/02_train_hemisphere_multinomial.py \
#              --config configs/hemisphere_config.yaml --hemisphere left
# =============================================================================


# DATA PATHS & STRUCTURE
# -----------------------------------------------------------------------------
data:
  input_dir: "data/processed/hemispheres"          # Hemisphere-split connectivity matrices
  raw_data_dir: "data/raw"                         # Original data location
  output_dir: "data/results/hemisphere_analysis"   # Results destination
  region_info_file: "data/processed/region_info.csv"  # Network assignments per region
  
  dataset: "rest"                                   # 'rest' (PIOP2) or 'task' (PIOP1)
  hemisphere_split_method: "atlas_based"            # Use LH_/RH_ prefix from atlas
  include_bilateral: false                          # Exclude brainstem/cerebellum (not lateralized)
  data_format: "csv"                                # 'csv' or 'npy'
  return_matrices: true                             # Convert upper triangle to full 116×116 matrices


# TESTING/SAMPLING CONFIGURATION
# -----------------------------------------------------------------------------
# Use this for quick testing during development before running full experiments
testing:
  enabled: false                      # Enable testing mode (can override with --sample CLI arg)
  sample_size: 10                     # Number of subjects to use for testing
  sample_method: "first_n"            # Method: 'first_n' (deterministic) or 'random'
  random_state: 42                    # Only used if sample_method is 'random'
  
  # Testing mode warnings
  show_warnings: true                 # Display prominent warnings that this is test mode
  save_to_separate_dir: false         # Save test results to separate directory (e.g., test_n10/)
  
  # Quick testing presets
  presets:
    quick_test: 5                     # Ultra-fast test (5 subjects)
    dev_test: 10                      # Development testing (10 subjects)
    validation_test: 20               # Validation testing (20 subjects)
    production: null                  # Full dataset (all subjects)


# PREPROCESSING PIPELINE
# -----------------------------------------------------------------------------
# Applied per-fold to prevent data leakage (fit on train, transform on test)
preprocessing:
  apply_fisher_z: true                # Stabilize correlation distributions 
  diagonal_strategy: "region_mean"    # Impute self-connections: 'zero', 'region_mean', 'network_mean'
  standardize: true                   # Zero mean, unit variance (fit on train only)
  feature_selection: null             # Options: null, 'variance_threshold', 'mutual_info'
  variance_threshold: 0.01            # Only if feature_selection enabled


# CROSS-VALIDATION STRATEGY
# -----------------------------------------------------------------------------
# GroupKFold prevents subject-level data leakage 
cross_validation:
  n_folds: 5                          # Number of CV folds
  cv_strategy: "GroupKFold"           # Ensures no subject in both train/test
  random_state: 42                    # For reproducibility
  shuffle: false                      # Not applicable to GroupKFold


# MULTINOMIAL LOGISTIC REGRESSION
# -----------------------------------------------------------------------------
multinomial:
  model_type: "LogisticRegression"
  multi_class: "multinomial"          # 116-class softmax classifier
  solver: "lbfgs"                     # Options: 'lbfgs', 'sag', 'saga', 'newton-cg'
  C: 0.1                              # Inverse regularization strength (null = auto-optimize)
  penalty: "l2"                       # L2 regularization
  max_iter: 1000                      # Maximum optimization iterations
  tol: 0.0001                         # Convergence tolerance
  class_weight: null                  # Options: null, 'balanced'
  n_jobs: -1                          # Use all CPU cores
  verbose: 0                          # Suppress iteration logs


# ONE-VS-REST (OvR) ALTERNATIVE
# -----------------------------------------------------------------------------
# Each region vs. all other 115 regions (handles class imbalance)
ovr:
  model_type: "LogisticRegression"
  solver: "lbfgs"
  C: 1.0
  max_iter: 1000
  class_weight: "balanced"            # Critical for 1-vs-115 imbalance
  n_jobs: -1
  verbose: 0
  aggregation_method: "max_decision"  # 'max_decision' or 'calibrated_proba'


# ONE-VS-ONE (OvO) PAIRWISE CLASSIFICATION
# -----------------------------------------------------------------------------
# Analyze confused region pairs (e.g., bilateral homologs)
ovo:
  selection_strategy: "error_driven"  # Options: 'error_driven', 'network_focused', 'spatial', 'all_pairs', 'custom'
  max_pairs: 200                      # Limit for computational efficiency
  confusion_threshold: 0.05           # Min confusion rate to analyze pair
  spatial_distance_threshold: 30.0    # Max distance (mm) for 'spatial' strategy
  custom_pairs_file: null             # CSV with region_id_1, region_id_2 columns
  
  model_type: "LogisticRegression"
  solver: "lbfgs"
  C: 1.0
  max_iter: 1000
  class_weight: null                  # OvO naturally balanced
  n_jobs: -1
  verbose: 0


# HYPERPARAMETER TUNING
# -----------------------------------------------------------------------------
hyperparameter_optimization:
  enabled: true                      # Enable grid/random search 
  method: "GridSearchCV"              # Options: 'GridSearchCV', 'RandomizedSearchCV', 'BayesianOptimization'
  param_grid:
    C: [0.001, 0.003, 0.01, 0.1, 1.0, 5.0]
    max_iter: [300, 500,1000]
  scoring: "accuracy"                 # Options: 'accuracy', 'balanced_accuracy', 'f1_weighted'
  cv_folds: 3                         # Inner CV folds for tuning
  n_jobs: -1
  verbose: 1
  n_iter: 20                          # For RandomizedSearchCV
  refit: true                         # Refit best model on full training set


# EVALUATION METRICS
# -----------------------------------------------------------------------------
evaluation:
  metrics: ["accuracy", "balanced_accuracy", "precision", "recall", "f1_score", 
            "cohen_kappa", "matthews_corrcoef", "top_5_accuracy", "top_10_accuracy"]
  confusion_matrix_normalize: false   # Options: false, 'true', 'pred', 'all'
  compute_per_region: true            # Region-level accuracy
  compute_network_level: true         # Network-level accuracy (visual, motor, DMN, etc.)
  analyze_error_distribution: true    # Identify common misclassification patterns
  save_predictions: true              # Save all predictions to CSV
  save_probabilities: true            # Save class probabilities
  save_models: false                  # Large files (~50MB per fold)


# VISUALIZATION SETTINGS
# -----------------------------------------------------------------------------
visualization:
  format: "png"                       # Options: 'png', 'pdf', 'svg'
  dpi: 300
  
  figure_sizes:  # (width, height) in inches
    confusion_matrix: [12, 10]
    per_region_accuracy: [14, 8]
    network_accuracy: [10, 6]
    comparison_plot: [10, 6]
    summary_figure: [16, 12]
  
  color_schemes:
    confusion_matrix: "Blues"
    per_region: "steelblue"
    network: "Set3"
    comparison: ["steelblue", "coral"]
  
  show_network_boundaries: true       # Draw lines separating networks in confusion matrix
  font_sizes: {title: 13, axis_label: 11, tick_label: 9, legend: 9}
  show_grid: true
  grid_alpha: 0.3
  grid_linestyle: "--"


# STRATEGY COMPARISON (MULTINOMIAL VS OVR VS OVO)
# -----------------------------------------------------------------------------
comparison:
  strategies: ["multinomial", "ovr"]  # Add "ovo" if needed
  statistical_tests: ["paired_ttest", "pearson_correlation", "mcnemar"]
  alpha: 0.05                         # Significance threshold
  correction_method: "fdr_bh"         # Multiple comparison correction: null, 'bonferroni', 'fdr_bh'
  generate_report: true
  report_format: "txt"                # Options: 'txt', 'pdf', 'html'


# HEMISPHERE COMPARISON (LEFT VS RIGHT)
# -----------------------------------------------------------------------------
hemisphere_comparison:
  enabled: true
  tests: ["independent_ttest", "paired_ttest", "pearsonr"]
  alpha: 0.05


# COMPUTATIONAL RESOURCES
# -----------------------------------------------------------------------------
computation:
  use_gpu: false                      # Not applicable to LogisticRegression
  n_jobs: -1                          # Use all CPU cores
  memory_efficient: true              # Optimize memory usage
  batch_size: null                    # Not applicable
  
  htcondor:                           # HPC cluster configuration
    enabled: false
    submit_file: "configs/htcondor_submit.sub"
    request_cpus: 4
    request_memory: "8GB"
    request_disk: "10GB"


# LOGGING CONFIGURATION
# -----------------------------------------------------------------------------
logging:
  level: "INFO"                       # 'DEBUG', 'INFO', 'WARNING', 'ERROR', 'CRITICAL'
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_to_file: true
  log_dir: "logs"
  log_filename_template: "{script_name}_{hemisphere}_{timestamp}.log"
  log_to_console: true


# OUTPUT STRUCTURE 
# -----------------------------------------------------------------------------
output:
  create_subdirectories: true
  subdirectory_structure: ["multinomial", "ovr", "ovo", "comparison"]
  use_timestamps: false               # Add timestamp to filenames
  timestamp_format: "%Y%m%d_%H%M%S"
  compress_predictions: false         # Gzip large prediction files
  compression_format: "gzip"          # Options: 'gzip', 'bz2', 'xz'
  save_intermediate: true             # Save per-fold results
  cleanup_temp_files: true


# REPRODUCIBILITY 
# -----------------------------------------------------------------------------
reproducibility:
  random_state: 42                    # Master seed
  numpy_seed: 42
  python_seed: 42
  use_deterministic: true             # Slower but fully reproducible
  save_environment_info: true         # Save package versions, system info
  environment_info_file: "environment_info.txt"


# ADVANCED OPTIONS (EXPERIMENTAL)
# -----------------------------------------------------------------------------
advanced:
  feature_engineering:
    enabled: false
    methods: []                       # Options: 'pca', 'ica', 'polynomial'
  
  ensemble:
    enabled: false
    methods: []                       # Options: 'voting', 'stacking', 'bagging'
  
  probability_calibration:
    enabled: false
    method: "sigmoid"                 # Options: 'sigmoid', 'isotonic'
  
  sample_weighting:
    enabled: false
    method: null


# DATA VALIDATION CHECKS
# -----------------------------------------------------------------------------
validation:
  check_data_integrity: true          # Verify file existence, correct shapes
  check_nan: true                     # Detect missing values
  check_inf: true                     # Detect infinite values
  check_leakage: true                 # Verify train/test subject separation
  validate_cv_splits: true            # Confirm GroupKFold behavior
  check_class_balance: true
  warn_imbalance_threshold: 0.1       # Warn if any class < 10% of data


# =============================================================================
# COMMAND-LINE OVERRIDE EXAMPLES
# =============================================================================
# Override regularization:
#   python 02_train_hemisphere_multinomial.py --config hemisphere_config.yaml \
#       --hemisphere left --regularization_C 10.0
#
# Change diagonal strategy:
#   python 02_train_hemisphere_multinomial.py --config hemisphere_config.yaml \
#       --hemisphere both --diagonal_strategy network_mean
#
# Enable hyperparameter optimization:
#   python 02_train_hemisphere_multinomial.py --config hemisphere_config.yaml \
#       --hemisphere right --enable_hyperparam_opt
#
# Testing with sample subjects:
#   python 02_train_hemisphere_multinomial.py --config hemisphere_config.yaml \
#       --hemisphere left --sample 10
#
# Quick testing presets:
#   python 02_train_hemisphere_multinomial.py --hemisphere left --sample 5   # quick_test
#   python 02_train_hemisphere_multinomial.py --hemisphere left --sample 10  # dev_test
#   python 02_train_hemisphere_multinomial.py --hemisphere left --sample 20  # validation_test
# =============================================================================