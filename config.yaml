# Brain Connectivity Classification - Configuration

# Updated: November 2025
# Compatible with Pipeline-based model.py (StandardScaler support)

 
# Data files (CSV format)

data:
  piop2_file: "data/raw/PIOP2_restingstate.csv"      # Training: resting-state
  piop1_file: "data/raw/PIOP1_gstroop.csv"           # Testing: Gender Stroop task

# Output directories

output_dirs:
  processed: "data/processed"                        # Predictions, region lists, etc.
  models: "models"                                   # Saved .pkl pipelines
  tables: "reports/tables/basic_analysis"            # CSVs: error maps, confusion, comparisons
  figures: "reports/figures/basic_analysis"          # PNGs: error maps, comparisons

# Feature extraction
diagonal_strategy: "sample_from_matrix"                    # Options: "zero", "region_mean", "network_mean", "random", "regression_predictive", "knn_imputation", "sample_from_matrix"
                                                             
# Model training
model:
  scaler_type: "fisher_z"                      # CRITICAL: "fisher_z" (recommended) or "standard"
  C: 0.01                                            # L2 regularization strength (smaller = stronger)
  max_iter: 1000
  n_splits: 3                                        # GroupKFold cross-validation
  random_seed: 54

# Evaluation & Visualization
visualization:
  dpi: 300
  high_error_threshold: 0.30                         # Regions with error ≥ this = "hard to predict"
  low_error_threshold: 0.10                          # Regions with error ≤ this = "easy to predict"
  colormap_error: "RdBu_r"                           # Matplotlib colormap for error maps
  colormap_diff: "PRGn"                              # For rest vs. task difference plots

# Optional
logging:
  level: "INFO"                                      # DEBUG, INFO, WARNING, ERROR
  file: null                                         # Set path to enable file logging, e.g. "logs/pipeline.log"

sample:
  n_subjects: 10                                     # Used with --sample flag